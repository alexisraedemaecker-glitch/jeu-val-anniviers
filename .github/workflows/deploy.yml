name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois, et on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Vérifier le catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôles de cohérence
        run: python3 tools/check.py

      - name: Espaces avalés par htm
        run: python3 tools/check_espaces.py

  publier:
    name: Publier
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le dossier à publier
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'supabase' \
            --exclude 'tools' \
            --exclude 'Randos' \
            --exclude 'EvolutionValAnniviers' \
            --exclude '.env*' \
            --exclude '*.local.sql' \
            ./ _site/
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
